<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff5e8">
<title>海露 · 眼睛妆造局</title>
<style>
:root{--paper:#fff5e8;--ink:#302824;--pink:#f0708f;--mint:#7fd8c8;--yellow:#ffd35c;--purple:#b49bef;--blue:#8ed1f4;--line:#302824;--shadow:4px 5px 0 var(--line)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background-image:radial-gradient(#eacbb4 1px,transparent 1px);background-size:18px 18px}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #2278b8;outline-offset:3px}
.app{max-width:560px;min-height:100svh;margin:auto;padding:15px 16px 28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.brand{font-weight:950;font-size:17px;letter-spacing:.02em}.brand small{display:block;font-size:10px;letter-spacing:.18em;color:#76706a;margin-top:3px}
.pill{border:2px solid var(--ink);border-radius:99px;padding:7px 11px;font-size:11px;font-weight:800;background:#fffdf7}
.status{background:#fffdf8;border:2px solid var(--ink);border-radius:15px;padding:10px 12px;margin-bottom:18px;box-shadow:2px 3px 0 #d8c7b8}
.statusrow{display:flex;justify-content:space-between;font-size:11px;font-weight:850;margin:3px 0 7px}.track{height:8px;background:#eee3d9;border-radius:20px;overflow:hidden;margin-bottom:9px}.fill{height:100%;border-radius:20px;transition:width .25s}.blue{background:#79c7ef}.pink{background:var(--pink)}
.panel{background:#fffdf8;border:2px solid var(--ink);border-radius:23px;padding:17px;box-shadow:var(--shadow);margin-bottom:16px}
.eyebrow{display:inline-block;background:var(--yellow);border:2px solid var(--ink);border-radius:9px;padding:5px 9px;font-size:11px;font-weight:950;letter-spacing:.08em}
h1{font-size:clamp(29px,8vw,44px);line-height:1.08;letter-spacing:-.04em;margin:15px 0 9px}h2{font-size:25px;margin:11px 0 5px;letter-spacing:-.03em}p{line-height:1.55;margin:8px 0;color:#655951;font-size:14px}
.coverart{height:220px;border-radius:18px;border:2px solid var(--ink);background:linear-gradient(145deg,#d5f3ec,#fff0f3 58%,#f8dfa0);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin:14px 0}
.coverart .orbit{width:200px;height:145px;border:2px dashed #302824;border-radius:50%;transform:rotate(-12deg);display:flex;align-items:center;justify-content:center;background:#ffffff80}
.coverart .eye-img{width:175px;height:130px;border-radius:50%;border:2px solid var(--ink)}
.sticker{position:absolute;border:2px solid var(--ink);border-radius:15px;padding:8px 10px;font-weight:900;font-size:12px;box-shadow:2px 3px 0 var(--ink)}.sticker.one{left:13px;top:16px;background:var(--yellow);transform:rotate(-7deg)}.sticker.two{right:12px;bottom:15px;background:var(--purple);transform:rotate(6deg)}
.primary{width:100%;padding:14px 18px;border:2px solid var(--ink);border-radius:15px;background:var(--pink);font-weight:950;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}.primary:active{transform:translate(3px,3px);box-shadow:1px 2px 0 var(--ink)}
.secondary{padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:white;font-weight:850}
.stephead{display:flex;justify-content:space-between;align-items:center;gap:10px}.counter{font-size:11px;font-weight:900;color:#776e66}
.previewlabel{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:950;margin:3px 0 8px}
.eye-preview{height:188px;border:2px solid var(--ink);border-radius:17px;background:#f6c9c4;position:relative;overflow:hidden;margin:10px 0 13px;box-shadow:inset 0 -6px #efb2b0}
.eye-img{position:absolute;inset:0;background-image:var(--sheet,linear-gradient(135deg,#edc5bf,#ffe1db));background-size:200% 400%;background-repeat:no-repeat;transition:filter .2s;filter:saturate(.95)}
.lens-layer{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;background:radial-gradient(ellipse at 27% 55%,var(--lens-color,transparent) 0 7%,transparent 17%),radial-gradient(ellipse at 73% 55%,var(--lens-color,transparent) 0 7%,transparent 17%);opacity:.58}
.brow-layer{position:absolute;top:6px;left:12%;width:76%;height:42px;overflow:visible;filter:drop-shadow(0px 1px 0 #ffffff80)}
.previewmeta{display:flex;gap:7px;flex-wrap:wrap}.tag{font-size:11px;border:1.5px solid var(--ink);border-radius:20px;padding:5px 8px;background:#fff}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:13px 0 16px}
.choice{border:2px solid var(--ink);border-radius:16px;background:#fff;padding:8px;text-align:left;min-width:0;box-shadow:2px 3px 0 #d7c7bb;transition:transform .12s,background .12s}
.choice.selected{background:#ffedf1;border-color:var(--pink);box-shadow:3px 4px 0 var(--ink);transform:translate(-1px,-1px)}
.choice:active{transform:scale(.985)}.choicevisual{height:72px;border:1.5px solid #d8c5b9;border-radius:10px;background:#fff4ed;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px;position:relative}
.choicevisual .eye-img{inset:0}.choicetitle{font-weight:950;font-size:13px}.choicehint{font-size:10px;color:#776e66;margin-top:4px;line-height:1.35}
.browicon{width:100%;height:60px}.browicon path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.quizicon{font-size:33px}.questiontext{font-size:19px;font-weight:900;line-height:1.35;margin:14px 0 7px}.answer{padding:14px 12px;min-height:54px}
.navigation{display:flex;gap:10px;margin-top:14px}.navigation .primary{flex:1}.navigation .secondary{min-width:86px}
.drop-overlay{position:fixed;z-index:20;inset:0;background:#dff8f4f5;display:flex;align-items:center;justify-content:center;padding:22px}
.dropbox{max-width:420px;width:100%;border:2px solid var(--ink);border-radius:25px;background:#fffdf8;padding:23px;text-align:center;box-shadow:7px 8px 0 var(--ink)}
.dropstage{height:170px;border-radius:18px;background:linear-gradient(#c3f0ed,#f2fffc);position:relative;margin:16px 0;overflow:hidden;border:2px solid var(--ink);cursor:pointer}
.drop{position:absolute;left:calc(50% - 18px);top:22px;width:36px;height:48px;background:#68bce9;border:2px solid var(--ink);border-radius:70% 30% 65% 35%;transform:rotate(45deg);box-shadow:inset -5px -4px #3299cf;animation:fall 1.6s ease-in-out infinite}
.ripple{position:absolute;width:30px;height:12px;border:2px solid #3cacc8;border-radius:50%;bottom:27px;left:calc(50% - 15px);animation:ripple 1.6s infinite}
@keyframes fall{0%,15%{top:12px;transform:translateY(0) rotate(45deg)}65%,100%{top:99px;transform:translateY(0) rotate(45deg)}}@keyframes ripple{0%,50%{transform:scale(.4);opacity:0}70%{transform:scale(1);opacity:1}100%{transform:scale(2.2);opacity:0}}
.resulthead{text-align:center}.birdstage{height:210px;display:flex;justify-content:center;align-items:center;background:linear-gradient(145deg,#d9f4ed,#fce1e9 55%,#fff0c2);border:2px solid var(--ink);border-radius:20px;margin:14px 0;overflow:hidden}
.bird-svg{width:205px;height:160px;filter:drop-shadow(4px 5px 0 #30282425)}.bird-title{font-size:31px;font-weight:1000;margin:4px 0}.slogan{color:#e65d80;font-size:15px;font-weight:950}
.scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.score{background:#fff;border:2px solid var(--ink);border-radius:15px;padding:13px;text-align:center}.score b{font-size:28px;display:block}.score small{font-size:11px;font-weight:850}
.detailgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:13px 0}.detail{background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:8px 2px;text-align:center;min-width:0}.detail strong{font-size:10px;display:block}.detail span{font-size:10px;display:block;line-height:1.4;margin-top:5px;overflow-wrap:anywhere}
.birdgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.birdcard{border:1.5px solid var(--ink);background:#fff;border-radius:13px;padding:9px 4px;text-align:center}.birdcard.active{background:#fff0b8;border:2px solid var(--pink)}.birdcard svg{width:70px;height:48px}.birdcard b{display:block;font-size:10px;margin-top:3px}
.quote{border:2px dashed #d58aa0;border-radius:13px;padding:13px;background:#fff7fa;font-size:13px;line-height:1.5;margin:12px 0}
.brandbanner{background:linear-gradient(110deg,#136fbb,#7bc8f1);color:white;border:2px solid var(--ink);border-radius:17px;padding:15px;margin-top:14px;text-align:center;font-weight:950}
.brandbanner strong{display:block;font-size:21px}.brandbanner small{font-size:10px;font-weight:600}
.footer{font-size:10px;color:#82746a;text-align:center;margin-top:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#302824;color:white;padding:10px 15px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}.toast.show{opacity:1}
@media(min-width:520px){.app{padding-top:24px}.panel{padding:20px}.eye-preview{height:218px}.choicevisual{height:85px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">海露 HYLO<small>HYDRATION · EYE LOOK STUDIO</small></div><div class="pill" id="topPill">趣味互动 · 仅供娱乐</div></header>
<div class="status" id="status" hidden><div class="statusrow"><span>💧 水润能量</span><span id="waterText">30 / 100</span></div><div class="track"><div class="fill blue" id="waterFill" style="width:30%"></div></div><div class="statusrow"><span>💗 妆造进度</span><span id="makeupText">0 / 4</span></div><div class="track"><div class="fill pink" id="makeupFill" style="width:0%"></div></div></div>
<main id="view" aria-live="polite"></main>
<div class="footer">海露眼部护理 · 互动内容仅供娱乐，眼部不适请咨询专业医生</div>
</div><div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var eyeData=null, eyeImage=null, imageReady=false;
var state={screen:'cover',step:0,brow:1,shape:0,lash:0,lens:0,answers:[null,null,null,null],water:30,extra:0,dropletDone:false};
var browNames=['浓毛粗眉','温柔弯眉','紫韵挑眉','凌厉剑眉'];
var shapeNames=['圆形眼','半圆眼','四边形眼','三角形眼'];
var lashNames=['浓翘款','柔美款'];
var lensNames=['原瞳色','森绿','紫罗兰','落霞粉'];
var lensColors=['transparent','#43b981','#9b7be8','#f078a6'];
var quiz=[
 {title:'哪一瞬间，最容易让你心动？',sub:'有时候，眼神比语言先一步。',opts:[['眼神恰好相遇','心跳偷偷加速',4],['被记得的小细节','被认真放在心上',5],['一起笑到停不下来','自在又默契',3],['安静陪在身边','不用说话也安心',4]]},
 {title:'和老朋友见面，你最喜欢？',sub:'熟悉的人，会让时间变慢。',opts:[['聊到深夜','把最近的故事补回来',5],['去新的地方玩','一起收集新鲜回忆',4],['找家店慢慢吃','边吃边聊最舒服',4],['什么都不做','待在一起就很好',3]]},
 {title:'疲惫的一天结束后，你会？',sub:'把一点温柔留给自己。',opts:[['听歌发呆','让思绪慢慢安静',4],['找人聊聊天','把情绪轻轻说出来',5],['看点有趣的东西','先把自己逗笑',3],['早点睡觉','明天再重新出发',4]]},
 {title:'你希望别人记住你的哪一面？',sub:'你身上总有一种独特光芒。',opts:[['真诚又可靠','温柔是我的底色',5],['有趣又勇敢','喜欢把日子过出花',4],['冷静有主见','知道自己想去哪里',4],['细腻又浪漫','总能发现小小美好',5]]}
];
var birds={
 '晴空蓝鸟':{color:'#73bde9',quote:'你像晴天里透亮的风，坦率、轻盈，也总能给身边的人带来好心情。'},
 '新绿绿雀':{color:'#71bf94',quote:'你像雨后刚冒芽的新绿，温柔又有韧性，愿意慢慢长成自己喜欢的样子。'},
 '暮霞粉鸦':{color:'#ed8ca8',quote:'你像日落时柔软的霞光，敏锐而浪漫，能把普通的一天过成值得珍藏的片刻。'},
 '夜航紫莺':{color:'#9e8be4',quote:'你像夜色里的一点紫光，安静却有主见，心里始终藏着自己的方向。'},
 '烈日红鹎':{color:'#ec6d65',quote:'你像正午的一束暖阳，热烈、直接，遇见喜欢的事就会毫不犹豫地向前。'},
 '燎原黄鹂':{color:'#e9b64d',quote:'你像草地上跳跃的金色音符，灵动又勇敢，总能把好奇心变成新的旅程。'}
};
var birdMap=[
 ['晴空蓝鸟','新绿绿雀','暮霞粉鸦','烈日红鹎'],
 ['晴空蓝鸟','新绿绿雀','夜航紫莺','暮霞粉鸦'],
 ['烈日红鹎','新绿绿雀','暮霞粉鸦','夜航紫莺'],
 ['燎原黄鹂','新绿绿雀','烈日红鹎','夜航紫莺']
];
var questionsLen=quiz.length;
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function browSvg(i){var paths=[
 'M17 39 Q47 8 88 24 Q60 23 22 46 Z M113 24 Q154 8 183 39 Q147 23 119 46 Z',
 'M18 38 Q50 19 88 30 Q56 27 20 42 Z M113 30 Q151 19 182 38 Q144 27 115 42 Z',
 'M18 43 Q48 34 79 19 Q61 39 20 49 Z M121 19 Q153 34 182 43 L180 49 Q139 39 121 19 Z',
 'M17 42 L79 18 L88 24 L20 47 Z M112 24 L121 18 L183 42 L180 47 Z'
];var stroke=['#4a2928','#74524f','#7252a2','#27282d'][i];return '<svg class="browicon" viewBox="0 0 200 58" aria-hidden="true"><path d="'+paths[i]+'" stroke="'+stroke+'" stroke-width="'+(i===0?3:2)+'" fill="'+stroke+'"/></svg>'}
function eyeStyle(extra){var row=state.shape, col=state.lash;return 'background-position:'+ (col===0?'0%':'100%')+' '+(['0%','33.333%','66.667%','100%'][row])+';'}
function eyeCell(shape,lash,lens){var c=lensColors[lens];return '<div class="eye-img" style="background-position:'+(lash===0?'0%':'100%')+' '+(['0%','33.333%','66.667%','100%'][shape])+';'+(lens===0?'':'filter:saturate(1.1);')+'"></div>'}
function eyeFrame(){var browOverlay=browNames[state.brow]?'<div class="brow-layer">'+browSvg(state.brow)+'</div>':'';return '<div class="eye-preview">'+eyeCell(state.shape,state.lash,state.lens)+'<div class="lens-layer" style="--lens-color:'+lensColors[state.lens]+'"></div>'+browOverlay+'</div>'}
function selectedBird(){return birdMap[state.shape][state.lens]}
function birdSvg(name,small){var b=birds[name]||birds['晴空蓝鸟'];return '<svg class="bird-svg" viewBox="0 0 220 170" role="img" aria-label="'+esc(name)+'"><ellipse cx="110" cy="141" rx="66" ry="10" fill="#302824" opacity=".08"/><path d="M35 99 Q67 45 113 64 Q147 53 181 27 Q169 68 143 85 Q165 97 198 113 Q155 130 120 111 Q87 144 42 120 L20 137 L29 111 Z" fill="'+b.color+'" stroke="#302824" stroke-width="4" stroke-linejoin="round"/><path d="M66 91 Q88 70 116 77 Q99 99 74 108Z" fill="#ffffff80"/><path d="M35 99 L8 88 L24 113Z" fill="#ed8a80" stroke="#302824" stroke-width="3" stroke-linejoin="round"/><circle cx="43" cy="94" r="5" fill="#302824"/><circle cx="44.5" cy="92" r="1.7" fill="#fff"/><path d="M78 116 Q112 124 143 105" fill="none" stroke="#302824" stroke-width="3" stroke-linecap="round"/><path d="M88 136 L83 148 M113 135 L117 148" stroke="#302824" stroke-width="3" stroke-linecap="round"/><path d="M72 44 Q95 23 117 43" fill="none" stroke="#ffffffa0" stroke-width="4" stroke-linecap="round"/></svg>'}
function updateStatus(){var hidden=state.screen==='cover';$('status').hidden=hidden;if(hidden)return;$('waterText').textContent=state.water+' / 100';$('waterFill').style.width=state.water+'%';$('makeupText').textContent=(state.step>3||state.screen==='result'?4:state.step)+' / 4';$('makeupFill').style.width=(Math.min(4,state.step)/4*100)+'%';}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(function(){$('toast').classList.remove('show')},1700)}
function renderCover(){return '<section class="panel"><span class="eyebrow">MY EYE LOOK · INTERACTIVE</span><h1>你的眼睛，<br>是一只鸟。</h1><p>从眉型、眼型到心动小测试，拼出属于你的眼神人格。最后看看，哪一只鸟与你最像。</p><div class="coverart"><span class="sticker one">小小眼神研究所</span><div class="orbit"><div class="eye-img" style="background-position:0% 0%;border-radius:50%;"></div></div><span class="sticker two">找到你的鸟类气质 ✦</span></div><div class="previewmeta"><span class="tag">✦ 4步眼妆</span><span class="tag">♡ 4道问答</span><span class="tag">💧 滴水互动彩蛋</span></div><br><button class="primary" id="startBtn">开始我的眼妆之旅　→</button></section><p style="text-align:center;font-size:11px">轻松选，不用想太久。第一直觉就是你的答案。</p>'}
function renderOptions(arr,selected,makeChoice){return '<div class="choices">'+arr.map(function(o,i){return '<button class="choice '+(selected===i?'selected':'')+'" data-choice="'+i+'"><div class="choicevisual">'+makeChoice(i)+'</div><div class="choicetitle">'+esc(o[0])+'</div><div class="choicehint">'+esc(o[1]||'选中后继续下一步')+'</div></button>'}).join('')+'</div>'}
function renderMakeup(){var s=state.step,title=['眉毛','眼型','睫毛','美瞳'][s],sub=['选一款眉型，让眼神先有自己的态度。','选择最像你、也最想尝试的眼型。','浓翘或柔美，选出眼神的节奏。','最后为眼睛添上一抹色彩。'][s],options='';
if(s===0){options=renderOptions([['浓毛粗眉','存在感强，利落有力量'],['温柔弯眉','自然柔和，温婉亲切'],['紫韵挑眉','带一点俏皮和艺术感'],['凌厉剑眉','线条清晰，自信果断']],state.brow,browSvg)}
if(s===1){options=renderOptions(shapeNames.map(x=>[x,'来自参考眼睛图鉴']),state.shape,function(i){return eyeCell(i,state.lash,0)})}
if(s===2){options=renderOptions([['浓翘款','更有张力的眼神'],['柔美款','轻盈温柔的感觉']],state.lash,function(i){return eyeCell(state.shape,i,state.lens)})}
if(s===3){options=renderOptions([['原瞳色','保留原本的光'],['森绿','像林间新叶'],['紫罗兰','神秘又安静'],['落霞粉','温柔浪漫']],state.lens,function(i){return '<div style="position:absolute;inset:0">'+eyeCell(state.shape,state.lash,i)+'</div><span style="z-index:1;width:27px;height:27px;border-radius:50%;border:2px solid #302824;background:'+lensColors[i]+';box-shadow:0 2px 0 #302824;position:absolute;right:7px;bottom:7px"></span>'})}
return '<section class="panel"><div class="stephead"><span class="eyebrow">眼妆 0'+(s+1)+'</span><span class="counter">第 '+(s+1)+' / 8 步</span></div><h2>'+title+'</h2><p>'+sub+'</p><div class="previewlabel"><span>实时妆造预览</span><span>选择后会保留</span></div>'+eyeFrame()+'<div class="previewmeta"><span class="tag">眉型：'+browNames[state.brow]+'</span><span class="tag">眼型：'+shapeNames[state.shape]+'</span><span class="tag">睫毛：'+lashNames[state.lash]+'</span><span class="tag">美瞳：'+lensNames[state.lens]+'</span></div>'+options+'<div class="navigation"><button class="secondary" id="backBtn">上一步</button><button class="primary" id="nextBtn">'+(s===3?'完成妆造，去答题　→':'确认选择，继续　→')+'</button></div></section>'}
function renderQuiz(){var q=state.step-4,question=quiz[q];var opts=renderOptions(question.opts.map(function(x){return [x[0],x[1]]}),state.answers[q],function(i){return '<span class="quizicon">'+['✦','♡','☁','☀'][i]+'</span>'});return '<section class="panel"><div class="stephead"><span class="eyebrow">心动测试 0'+(q+1)+'</span><span class="counter">第 '+(state.step+1)+' / 8 步</span></div><h2>心动的眼睛</h2><div class="questiontext">'+question.title+'</div><p>'+question.sub+'</p>'+opts+'<div class="navigation"><button class="secondary" id="backBtn">上一步</button><button class="primary" id="nextBtn">'+(q===3?'揭晓我的鸟类人格　✦':'下一题　→')+'</button></div></section>'}
function renderResult(){var name=selectedBird(),bird=birds[name],completion=Math.min(100,24+12+14+12+14+state.extra),water=Math.min(100,state.water),rows=[

function render(){updateStatus();var v=$('view');if(state.screen==='cover'){v.innerHTML=renderCover();$('startBtn').onclick=function(){state.screen='makeup';state.step=0;render()};return}

function showDroplet(){var overlay=document.createElement('div');overlay.className='drop-overlay';overlay.innerHTML='<section class="dropbox"><span class="eyebrow">HYLO · 水润彩蛋</span><h2>接住这一滴温柔</h2><p>点击水面，给今天的自己一点水润能量。</p><div class="dropstage" id="dropStage"><div class="drop"></div><div class="ripple"></div></div><div id="dropMsg" style="font-size:12px;font-weight:850;margin:10px">点击水滴，完成互动</div><button class="primary" id="dropDone" disabled>收下水润能量　→</button></section>' ;document.body.appendChild(overlay);var caught=false;$('dropStage').onclick=function(){if(caught)return;caught=true;state.water=Math.min(100,state.water+25);state.extra=Math.min(24,state.extra+8);$('dropMsg').textContent='接住啦！水润能量 +25 💧';$('dropStage').style.background='radial-gradient(circle at 50% 75%,#fff 0 12%,#b8f4e4 13% 45%,#dff8f4 70%)';$('dropDone').disabled=false;$('dropDone').style.opacity='1'};$('dropDone').onclick=function(){state.dropletDone=true;overlay.remove();state.step=6;state.screen='quiz';render()}}
function drawPoster(){var c=$('poster');if(!c)return;var ctx=c.getContext('2d'),name=selectedBird(),b=birds[name];ctx.fillStyle='#fff5e8';ctx.fillRect(0,0,750,1240);ctx.fillStyle='#302824';ctx.font='bold 23px sans-serif';ctx.fillText('MY EYE LOOK',44,60);ctx.font='bold 18px sans-serif';ctx.fillText('TYPE '+String(1+state.shape*4+state.lens).padStart(2,'0')+'/16',560,60);ctx.fillStyle='#f8d7d5';ctx.strokeStyle='#302824';ctx.lineWidth=4;roundRect(ctx,35,90,680,320,28);ctx.fill();ctx.stroke();if(imageReady){var sx=state.lash*360,sy=state.shape*150;ctx.save();roundRect(ctx,48,103,654,294,22);ctx.clip();ctx.drawImage(eyeImage,sx,sy,360,150,48,103,654,294);ctx.restore()}ctx.fillStyle='#e96d8c';ctx.font='bold 24px sans-serif';ctx.fillText('你的眼睛是一只鸟',45,470);ctx.fillStyle='#302824';ctx.font='bold 43px sans-serif';ctx.fillText(name,45,524);drawBirdCanvas(ctx,b.color,555,480);ctx.fillStyle='#302824';ctx.font='bold 19px sans-serif';ctx.fillText('妆造明细',45,600);var arr=[browNames[state.brow],shapeNames[state.shape],lashNames[state.lash],lensNames[state.lens],state.water+'分'];var labels=['眉毛','眼型','睫毛','美瞳','水润'];arr.forEach(function(x,i){var xx=40+i*137;ctx.fillStyle='#fff';roundRect(ctx,xx,625,126,86,12);ctx.fill();ctx.strokeStyle='#302824';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#777';ctx.font='14px sans-serif';ctx.fillText(labels[i],xx+12,650);ctx.fillStyle='#302824';ctx.font='bold 15px sans-serif';wrapCanvas(ctx,x,xx+12,675,102,17)});ctx.fillStyle='#302824';ctx.font='bold 19px sans-serif';ctx.fillText('妆容完成度',45,765);ctx.fillStyle='#e8d8d0';roundRect(ctx,45,785,660,20,10);ctx.fill();ctx.fillStyle='#f0708f';roundRect(ctx,45,785,660*Math.min(100,24+52+state.extra)/100,20,10);ctx.fill();ctx.fillStyle='#302824';ctx.font='bold 24px sans-serif';ctx.fillText(String(Math.min(100,76+state.extra))+'/100',610,765);ctx.fillStyle='#fff8fa';ctx.strokeStyle='#d58aa0';ctx.setLineDash([7,6]);roundRect(ctx,42,842,666,150,18);ctx.fill();ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#302824';ctx.font='19px sans-serif';wrapCanvas(ctx,b.quote,62,880,620,29);ctx.fillStyle='#167dbb';roundRect(ctx,35,1025,680,170,22);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 30px sans-serif';ctx.fillText('海露® HYLO®',70,1073);ctx.font='bold 22px sans-serif';ctx.fillText('眼睛干涩 · 就滴海露',70,1112);ctx.font='15px sans-serif';ctx.fillText('玻璃酸钠滴眼液 · 眼部护理',70,1143);ctx.font='12px sans-serif';ctx.fillText('仅供娱乐 · 眼部不适请及时咨询专业医生',70,1172)}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function wrapCanvas(ctx,text,x,y,maxWidth,lineHeight){var words=String(text).split(''),line='';for(var n=0;n<words.length;n++){var test=line+words[n];if(ctx.measureText(test).width>maxWidth&&n>0){ctx.fillText(line,x,y);line=words[n];y+=lineHeight}else line=test}ctx.fillText(line,x,y)}
