name: Deploy static game to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "make_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-final-release"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build and validate static site
        run: python3 make_site.py
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published page and image
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -e
          echo "Checking public page: $SITE_URL"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$SITE_URL" -o /tmp/page.html; then
              break
            fi
            echo "Page not ready (attempt $attempt); retrying..."
            sleep 5
          done
          grep -q "海露" /tmp/page.html
          grep -q "data:image/webp;base64" /tmp/page.html
          grep -q "startBtn" /tmp/page.html
          echo "PASS: page is served, game start control exists, and eye image is embedded in the HTML."
